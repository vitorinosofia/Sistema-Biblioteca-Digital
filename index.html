<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Biblioteca Digital</h1>
  </header>

  <main>
<input id="searchInput" placeholder="Digite o nome do livro">
<button id="searchBtn">Buscar</button>

<div id="result"></div>
    <section class="card">
      <h2>Livros da Biblioteca</h2>
      <div id="books"></div>
    </section>

    <section class="card">
      <h2>Resumos</h2>
      <div id="summaries"></div>
    </section>

    <section class="card">
      <h2>Livros de Arvid Kahl</h2>
      <div id="arvid"></div>
    </section>

    <section class="card">
      <h2>Livros de James Clear</h2>
      <div id="james"></div>
    </section>

    <section class="card">
      <h2>Total de Páginas</h2>
      <div id="pages"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
